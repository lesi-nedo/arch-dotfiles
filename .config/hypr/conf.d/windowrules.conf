
# --- Idle inhibit (prevents hypridle from locking/suspending) ---
# Hyprland can mark specific windows as "idle inhibited".
# When an inhibit is active, apps like hypridle will NOT fire timeouts (lock, dpms off, suspend, etc.).
#
# 1) Find the window class/title:
#    hyprctl clients
#
# 2) Then enable one of these rules (remove the leading '#'):
#
# Inhibit ONLY while the app is focused (good for games, presentations, etc.):
# windowrule = idle_inhibit focus, match:class ^(mpv|vlc|steam)$
#
# Inhibit ONLY while the app is fullscreen (good for browsers/videos in fullscreen):
# windowrule = idle_inhibit fullscreen, match:class ^(firefox|chromium|Brave-browser)$
#
# Always inhibit for that app (be careful: it will never idle-lock/suspend while it exists):
# windowrule = idle_inhibit always, match:class ^(obs)$

# Visual Studio Code (recommended: inhibit only while focused):
# NOTE: class can be one of: Code, code, code-oss, VSCodium, code-url-handler (check `hyprctl clients`).
windowrule = idle_inhibit always, match:class ^(Code|code|code-oss|VSCodium|code-url-handler)$


